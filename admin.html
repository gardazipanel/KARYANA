<!DOCTYPE html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dukan Hisab — Owner Dashboard</title><meta name="robots" content="noindex"><script src="config.js"></script>
<style>
:root{--g:#05955f;--bd:#e1e8f1;--m:#6a7f9e;--bg:#f2f5fa;--t:#0a1424;--c:#fff;--r:#e0301f;--o:#e8670c;--b:#0a6ee8}
*{box-sizing:border-box;font-family:system-ui,Roboto,Arial,sans-serif}body{margin:0;background:var(--bg);color:var(--t);font-size:15px}
.w{max-width:1000px;margin:0 auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1{font-size:20px;margin:0}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(min-width:700px){.st{grid-template-columns:repeat(6,1fr)}}
.st div{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}.st b{display:block;font-size:22px}.st span{font-size:12px;color:var(--m)}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:15px;background:var(--c);color:var(--t)}
button{border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;background:var(--g);color:#fff}button.l{background:var(--c);color:var(--t);border:1px solid var(--bd)}button.d{background:var(--r)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.chips button{white-space:nowrap}.chips button.l.on{background:var(--g);color:#fff;border-color:var(--g)}
.it{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}.it .m{color:var(--m);font-size:13px}
.bd{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;background:var(--g)}.bd.t{background:var(--b)}.bd.x{background:var(--r)}.bd.k{background:#444}
#mo{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}#mo.on{display:flex}#mb{background:var(--c);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:90vh;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;gap:8px;margin:8px 0;align-items:center}.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)}.kv span{color:var(--m)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:99}
</style></head><body><div class="w" id="app"></div><div id="mo" onclick="if(event.target==this)cm()"><div id="mb"></div></div><div id="toast"></div>
<script>
const C=window.EK_CFG||{url:'',key:''},$=s=>document.querySelector(s),N=30;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let SES=null,ME=null,F='all',Q='',PG=0,TOT=0,ROWS=[],ST=null;try{SES=JSON.parse(localStorage.getItem('ek_adm'))}catch(e){}
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
const cm=()=>$('#mo').classList.remove('on'),mo=h=>{$('#mb').innerHTML=h;$('#mo').classList.add('on')};
async function fresh(){if(SES&&SES.exp-60<Date.now()/1000){try{const r=await fetch(C.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:C.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SES.rt})});const j=await r.json();if(r.ok)ses(j);else{SES=null;localStorage.removeItem('ek_adm')}}catch(e){}}}
const ses=j=>{SES={at:j.access_token,rt:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)};try{localStorage.setItem('ek_adm',JSON.stringify(SES))}catch(e){}};
async function api(p,o={},raw){const au=p.startsWith('/auth/');if(!au)await fresh();const r=await fetch(C.url+p,{...o,headers:{apikey:C.key,'Content-Type':'application/json',...(((!au&&SES)?SES.at:C.key).startsWith('sb_')?{}:{Authorization:'Bearer '+((!au&&SES)?SES.at:C.key)}),...(o.headers||{})}});const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){j=t}if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description||j.error))||('Error '+r.status));return raw?{j,r}:j}
const rpc=(f,b)=>api('/rest/v1/rpc/'+f,{method:'POST',body:JSON.stringify(b||{})});
const dleft=d=>Math.ceil((new Date(d)-Date.now())/864e5);
function badge(p){const x=new Date(p.expires_at)<new Date();return p.blocked?'<span class="bd k">BLOCKED</span>':x?'<span class="bd x">EXPIRED</span>':p.plan=='trial'?'<span class="bd t">TRIAL</span>':'<span class="bd">'+esc(p.plan)+'</span>'}
const exp=p=>new Date(p.expires_at).getFullYear()>=2099?'Lifetime':(dleft(p.expires_at)<0?'Expire: '+new Date(p.expires_at).toLocaleDateString():dleft(p.expires_at)+' din baqi');
const wa=p=>{let n=String(p.phone||'').replace(/\D/g,'');if(n.startsWith('0'))n='92'+n.slice(1);return n};
function loginUI(m){$('#app').innerHTML=`<div class="card" style="max-width:380px;margin:60px auto"><h1>Owner Dashboard</h1><p style="color:var(--m)">Dukan Hisab — sirf owner ke liye</p><input id="e" type="email" placeholder="Email" style="margin-bottom:8px"><input id="p" type="password" placeholder="Password" onkeydown="if(event.key=='Enter')go()" style="margin-bottom:10px"><button style="width:100%" onclick="go()">Login</button><p style="color:var(--r)">${esc(m||'')}</p></div>`}
async function go(){try{const j=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('#e').value.trim().toLowerCase(),password:$('#p').value})});ses(j);await boot()}catch(e){loginUI(/invalid/i.test(e.message)?'Email ya password ghalat hai':e.message)}}
function out(){SES=null;localStorage.removeItem('ek_adm');loginUI()}
async function boot(){if(!/^https?:/.test(C.url||'')){return loginUI('config.js mein Supabase URL/key nahi hai')}if(!SES)return loginUI();try{ME=await rpc('get_me');if(!ME||!ME.is_admin){out();return loginUI('Ye account owner (admin) nahi hai')}}catch(e){return loginUI(e.message)}shell();await load()}
function shell(){$('#app').innerHTML=`<div class="top"><h1><img src="icon.svg" style="width:30px;height:30px;vertical-align:middle;border-radius:8px;margin-right:8px">Dukan Hisab — Owner</h1><div><button class="l" onclick="csv()">CSV</button> <button class="l" onclick="out()">Logout</button></div></div><div class="st" id="st"></div><div class="chips" id="ch"></div><input id="q" placeholder="Search: dukaan, naam, email, phone" oninput="clearTimeout(window._t);window._t=setTimeout(()=>{Q=this.value.trim();PG=0;load()},350)"><div id="ls" style="margin-top:10px"></div><div class="row" style="justify-content:center" id="pg"></div>`;chips()}
function chips(){const L=[['all','Sab'],['active','Active'],['trial','Trial'],['expired','Expired'],['blocked','Blocked']];$('#ch').innerHTML=L.map(x=>`<button class="l ${F==x[0]?'on':''}" onclick="F='${x[0]}';PG=0;chips();load()">${x[1]}</button>`).join('')}
function qs(){const n=encodeURIComponent(new Date().toISOString());let u='select=*&order=created_at.desc';if(F=='active')u+=`&plan=neq.trial&expires_at=gt.${n}&blocked=eq.false`;if(F=='trial')u+=`&plan=eq.trial&expires_at=gt.${n}&blocked=eq.false`;if(F=='expired')u+=`&expires_at=lte.${n}`;if(F=='blocked')u+='&blocked=eq.true';if(Q){const k=encodeURIComponent(Q.replace(/[(),*%\\]/g,''));u+=`&or=(email.ilike.*${k}*,shop.ilike.*${k}*,owner.ilike.*${k}*,phone.ilike.*${k}*)`}return u}
async function load(){try{const [s,{j,r}]=await Promise.all([rpc('admin_stats'),api('/rest/v1/profiles?'+qs(),{headers:{Prefer:'count=exact','Range-Unit':'items',Range:`${PG*N}-${PG*N+N-1}`}},1)]);ST=s;ROWS=j||[];TOT=+((r.headers.get('content-range')||'').split('/')[1])||ROWS.length;draw()}catch(e){toast(e.message)}}
function draw(){const s=ST;$('#st').innerHTML=[['Kul',s.total],['Active',s.active],['Trial',s.trial],['Expired',s.expired],['Blocked',s.blocked],['Aaj naye',s.today]].map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
$('#ls').innerHTML=ROWS.length?ROWS.map((p,i)=>`<div class="card it" onclick="det(${i})"><div><b>${esc(p.shop||'(naam nahi)')}</b> ${badge(p)}<div class="m">${esc(p.owner||'')} · ${esc(p.phone||'')}</div><div class="m">${esc(p.email)}</div></div><div style="text-align:right"><div class="m">${exp(p)}</div><div class="m">${p.n_products} products · ${p.n_sales} sales</div></div></div>`).join(''):'<div class="card" style="text-align:center;color:var(--m)">Koi customer nahi mila</div>';
const pages=Math.max(1,Math.ceil(TOT/N));$('#pg').innerHTML=`<button class="l" ${PG<1?'disabled':''} onclick="PG--;load()">Pichla</button><span>${PG+1} / ${pages} (${TOT})</span><button class="l" ${PG+1>=pages?'disabled':''} onclick="PG++;load()">Agla</button>`}
function det(i){const p=ROWS[i],kv=(a,b)=>`<div class="kv"><span>${a}</span><b>${b}</b></div>`;mo(`<div class="top"><h1>${esc(p.shop||'')}</h1>${badge(p)}</div>${kv('Owner',esc(p.owner))}${kv('Email',esc(p.email))}${kv('Phone',esc(p.phone))}${kv('Plan',esc(p.plan))}${kv('Expiry',new Date(p.expires_at).getFullYear()>=2099?'Lifetime':new Date(p.expires_at).toLocaleDateString()+' ('+exp(p)+')')}${kv('Products / Sales / Clients',p.n_products+' / '+p.n_sales+' / '+p.n_clients)}${kv('Total Sale','Rs '+Math.round(p.total_sale).toLocaleString())}${kv('Signup',new Date(p.created_at).toLocaleString())}${kv('Aakhri baar',p.last_seen?new Date(p.last_seen).toLocaleString():'-')}${kv('Referral code',esc(p.ref_code))}${p.referred_by?kv('Kis ne refer kiya',esc(p.referred_by)):''}
<h3 style="margin:14px 0 6px">Plan Renew</h3><div class="g2">${[['1 Month',1],['3 Months',3],['6 Months',6],['1 Year',12]].map(x=>`<button onclick="plan(${i},'${x[0]}',${x[1]},0,false)">${x[0]}</button>`).join('')}<button style="grid-column:1/3;background:#b8860b" onclick="plan(${i},'Lifetime',0,0,true)">Lifetime</button></div>
<div class="row"><input id="dy" type="number" placeholder="Custom din (jaise 15)"><button onclick="plan(${i},'Custom',0,+$('#dy').value||0,false)">Din add</button></div>
<div class="row">${p.phone?`<a href="https://wa.me/${wa(p)}" target="_blank" style="flex:1;text-decoration:none"><button class="l" style="width:100%">WhatsApp</button></a>`:''}<button class="${p.blocked?'':'d'}" style="flex:1" onclick="blk(${i},${!p.blocked})">${p.blocked?'Unblock':'Block'}</button></div><button class="l" style="width:100%" onclick="cm()">Band</button>`)}
async function plan(i,n,m,d,l){const p=ROWS[i];if(!l&&!m&&!d)return toast('Din likhein');if(!confirm(p.shop+': '+n+(d?' ('+d+' din)':'')+' lagana hai?'))return;try{await rpc('admin_set_plan',{uid:p.id,p_plan:n,p_months:m,p_days:d,p_life:l});toast('Plan lag gaya');cm();await load()}catch(e){toast(e.message)}}
async function blk(i,b){const p=ROWS[i];if(!confirm((b?'Block':'Unblock')+' karein: '+p.shop+'?'))return;try{await rpc('admin_set_block',{uid:p.id,b});toast('Ho gaya');cm();await load()}catch(e){toast(e.message)}}
async function csv(){try{let all=[],k=0;for(;;){const j=await api('/rest/v1/profiles?select=*&order=created_at.desc',{headers:{'Range-Unit':'items',Range:`${k}-${k+999}`}});all=all.concat(j||[]);if(!j||j.length<1000)break;k+=1000}const H=['shop','owner','email','phone','plan','expires_at','blocked','n_products','n_sales','n_clients','total_sale','ref_code','created_at','last_seen'];const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const t=[H.join(',')].concat(all.map(r=>H.map(h=>q(r[h])).join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='customers.csv';a.click()}catch(e){toast(e.message)}}
boot();
</script></body></html>
