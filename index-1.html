<script>
const CFG=window.EK_CFG||{url:"",key:""};const WA=String(CFG.wa||"").replace(/\D/g,"");
const ld=()=>{try{return JSON.parse(localStorage.getItem('ek'))}catch(e){return null}};
let S=ld()||{u:null,p:[],s:[],c:[],e:[],pay:[],dark:0,lang:'Roman Urdu',low:1,snd:1};
let OK=1,IDB=0;try{localStorage.setItem('ek_t','1');localStorage.removeItem('ek_t')}catch(e){OK=0}
const sv=n=>{let j;try{j=JSON.stringify(S)}catch(e){return}try{localStorage.setItem('ek',j);OK=1}catch(e){OK=0}idbSet(j);if(!n&&typeof cpush=='function')cpush()};
let R='home',cart=[],per=0,q='',fl='Sab',cat='Sab',tab='k',csel=null,pm='cash',disc=0,hp=3,mode='piece',pl=0,sp=0,sq='';
const $=s=>document.querySelector(s),app=$('#app');
const M=n=>'Rs '+Math.round(n||0).toLocaleString(),id=()=>Date.now()+Math.random().toString(36).slice(2,5);

const DAYS=[1,7,30,90,180,365,0],PN=['Aaj','7 Din','30 Din','3 Mahine','6 Mahine','1 Saal','🗂️ Lifetime'];
const inR=(t,i)=>i==7?(t>=cr.a&&t<=cr.b):DAYS[i]==0||t>=D0()-(DAYS[i]-1)*864e5;

const cm=()=>{$('#m').classList.remove('on');const v=$('#tv');if(v)v.pause()},mo=h=>{$('#mb').innerHTML=ico(h);$('#m').classList.add('on')};

const cats=['Kiryana','Doodh/Dairy','Bakery','Mashrubaat','Snacks','Medical','Mobile','Other'],ecats=['Bijli','Kiraya','Labour','Transport','Internet','Maintenance','Other'];
// ---- calculations
const cashIn=f=>S.s.filter(f).reduce((a,s)=>a+s.cash,0)+S.pay.filter(f).reduce((a,p)=>a+(p.m=='cash'?p.amt:0),0);
const onIn=f=>S.s.filter(f).reduce((a,s)=>a+s.online,0)+S.pay.filter(f).reduce((a,p)=>a+(p.m=='online'?p.amt:0),0);
const cashOut=f=>S.e.filter(f).reduce((a,e)=>a+e.cash,0),onOut=f=>S.e.filter(f).reduce((a,e)=>a+e.online,0);
const all=()=>true,tdy=x=>x.t>=D0();
const cbal=c=>S.s.filter(s=>s.cl==c.id).reduce((a,s)=>a+s.ud,0)-S.pay.filter(p=>p.cl==c.id).reduce((a,p)=>a+p.amt,0);
const trial=()=>ME?Math.max(0,Math.ceil((new Date(ME.expires_at)-Date.now())/864e5)):Math.max(0,7-Math.floor((Date.now()-S.u.t0)/864e5));
const empty=(i,t,b,a)=>`<div class="emp"><i>${i}</i><p>${t}</p>${b?`<button class="btn" style="width:auto;padding:12px 24px" onclick="${a}">${b}</button>`:''}</div>`;
const hdr=(t,s,x='')=>`<div class="row sp" style="margin:6px 0 12px"><div class="row"><button class="back" onclick="go('home')">←</button><div><h2 style="font-size:20px">${t}</h2><div class="m">${s||''}</div></div></div>${x}</div>`;

const nav=()=>{const t=[['home','▦','Home'],['stock','📦','Stock'],['sale','🛍️','Sale'],['udhaar','👥','Udhaar'],['reports','📊','Reports']];return `<div class="nav">${t.map(x=>`<button class="${(R==x[0]||(x[0]=='home'&&!['stock','sale','udhaar','reports','addp'].includes(R))||(x[0]=='stock'&&R=='addp'))?'on':''} ${x[0]=='sale'?'sale':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}</div>`};
const MAIN=['home','stock','sale','udhaar','reports','cash','online','hist','vendor','settings','profile','renew','addp'];
// ---- screens
function auth(reg){const L=['اردو رومن','اردو','English','हिन्दी','Bahasa'];
return `<div class="sc" style="margin-top:10px">${L.map((x,i)=>`<button class="chip ${i==0?'on':''}" onclick="S.lang='${x}';sv()">${x}</button>`).join('')}</div>
<div class="logo" style="padding:0;overflow:hidden"><img src="icon.svg" alt="Dukan Hisab" style="width:100%;height:100%;display:block"></div><h1 class="ctr">${reg?'Naya Account':'Dukan Hisab'}</h1><div class="ctr gr" style="font-weight:700;letter-spacing:1px;margin-bottom:16px">${reg?'Apna karyana store manage karein':'SHOPKEEPER PRO'}</div>
<div class="card" style="padding:20px">${reg?`<label>Shop Naam *</label><input id="a1" placeholder="Ali Karyana Store"><label>Owner Naam *</label><input id="a2" placeholder="Muhammad Ali"><label>Email *</label><input id="a3" type="email" placeholder="your@email.com"><label>Phone (optional)</label><input id="a4" placeholder="+92 3XX-XXXXXXX"><label>Password *</label><input id="a5" type="password" placeholder="Kam se kam 6 characters"><label>Password Confirm *</label><input id="a6" type="password" placeholder="Password dobara dalein"><label>Referral code (agar kisi ne di ho)</label><input id="a7" placeholder="Optional — e.g. ABCD1234"><button class="btn" onclick="signup()">Account Banayein →</button><p class="ctr">Pehle se account hai? <b class="gr" onclick="R='login';render()">Login Karein</b></p>`
:`<h2>Khush Aamdeed</h2><p>Apne shop account mein login karein</p><label>Email / Staff Username</label><input id="a1" placeholder="your@email.com ya staff username"><label>Password</label><input id="a2" type="password" placeholder="Password dalein"><div style="text-align:right;margin-bottom:12px"><a class="gr" style="font-weight:700" href="https://wa.me/${WA}" target="_blank">Password Bhool Gaye?</a></div><button class="btn" onclick="login()">Login →</button><p class="ctr m">— YA —</p><button class="btn l" onclick="R='reg';render()">Naya Account Banayein</button>`}</div>`}
function signup(){const v=i=>$('#a'+i).value.trim();if(!v(1)||!v(2)||!v(3)||v(5).length<6)return alert('Sab * fields bharein (password kam se kam 6)');if(v(5)!=v(6))return alert('Password match nahi');S.u={shop:v(1),owner:v(2),email:v(3),ph:v(4),pw:v(5),t0:Date.now(),code:'EK'+Math.random().toString(36).slice(2,8).toUpperCase()};S.in=1;sv();R='home';render()}

function home(){const T=cashIn(tdy)-cashOut(tdy)-S.s.filter(tdy).reduce((a,s)=>a+s.ud,0)*0,O=onIn(tdy)-onOut(tdy);
const sl=S.s.filter(tdy),rec=S.pay.filter(tdy).reduce((a,p)=>a+p.amt,0);
return `<div class="row sp"><div><span>Assalam o Alaikum 👋</span><h2>${S.u.owner}</h2></div><div class="row"><button class="back" onclick="tg(!S.dark);sv();render()">${S.dark?'☀️':'🌙'}</button><button class="back" onclick="go('settings')">⚙️</button></div></div>
<p class="m" style="font-weight:700;color:var(--m);margin:16px 0 6px">💰 Total Available Balance</p>
<div class="grid"><div class="hero" style="padding:12px;font-weight:800;font-size:18px">👛 ${M(cashIn(all)-cashOut(all))}</div><div class="hero b" style="padding:12px;font-weight:800;font-size:18px">📱 ${M(onIn(all)-onOut(all))}</div></div>
<div class="grid" style="margin-top:10px"><div class="hero" onclick="go('cash')"><div class="lb">Aaj ka Net Cash</div><div class="big">${M(T)}</div><div style="font-size:12px;opacity:.9">Cash + Received − Udhaar</div></div><div class="hero b" onclick="go('online')"><div class="lb">Online</div><div class="big">${M(O)}</div><div style="font-size:12px;opacity:.9">Aaj ka online balance</div></div></div>
<div class="grid"><div class="card st o"><div class="lb">📋 Aaj ka Udhaar</div><div class="big or">${M(sl.reduce((a,s)=>a+s.ud,0))}</div><div class="m">Aaj diya gaya</div></div><div class="card st"><div class="lb">✅ Aaj Received</div><div class="big gr">${M(rec)}</div><div class="m">Aaj wapas mila</div></div>

<div class="card">${sl.length?sl.slice(-5).reverse().map(sline).join(''):empty('🧾','Aaj abhi koi sale nahi','Naya Sale',"go('sale')")}</div>

function scClose(){scStop();render()}
function scPanel(){const p=$('#scp');if(!p||!SC)return;try{localStorage.setItem('ek_cart',JSON.stringify(cart))}catch(e){}
if(!SC.sale){p.innerHTML='<div class="ctr m">Barcode frame mein rakhein</div>';return}
const t=cart.reduce((a,x)=>a+x.p*x.q,0),n=cart.reduce((a,x)=>a+x.q,0),old=$('#scl'),st=old?old.scrollTop:0;
p.innerHTML=ico(`<div class="row sp"><b style="font-size:18px">${n} ITEMS</b><b class="big gr">${M(t)}</b></div><div id="scl" style="max-height:21vh;overflow-y:auto;margin:4px 0 6px">${cart.length?cart.map((x,i)=>`<div class="row sp" style="padding:5px 0;border-bottom:1px solid var(--b)"><div style="flex:1;min-width:0"><div style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.n}</div><div class="m">${M(x.p)} × ${x.q} = ${M(x.p*x.q)}</div></div><div class="row" style="gap:6px"><button class="back" style="width:34px;height:34px" onclick="scQ(${i},-1)">−</button><b style="min-width:18px;text-align:center">${x.q}</b><button class="back" style="width:34px;height:34px" onclick="scQ(${i},1)">+</button></div></div>`).join(''):'<div class="ctr m" style="padding:10px 0">Barcode scan karein, items yahan judte jayenge</div>'}</div>${SC.nf?`<button class="btn l" style="margin-bottom:6px;height:40px" onclick="newFromCode('${SC.nf}')">+ Naya Product: ${SC.nf}</button>`:''}<div class="grid g3"><button class="btn" onclick="scPay('cash')">💵 Naqad</button><button class="btn" style="background:var(--bl)" onclick="scPay('online')">📱 Online</button><button class="btn o" onclick="scPay('udhaar')">📋 Udhaar</button></div><button class="btn l" style="margin-top:6px;height:40px" onclick="scClose()">Cart dekhein / Band karein</button>`);
const l=$('#scl');if(l)l.scrollTop=SC.top?0:Math.max(st,l.scrollHeight);SC.top=0}
try{const c=JSON.parse(localStorage.getItem('ek_cart')||'[]');if(Array.isArray(c))cart=c.filter(x=>x&&x.id&&x.q>0)}catch(e){}
render();
</script></body></html>
